version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bap-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bap_lb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bap-web-local
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bap_lb
      - BETTER_AUTH_URL=http://localhost:8080
    depends_on:
      - postgres

volumes:
  pgdata:
