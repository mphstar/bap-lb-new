version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bap-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bap_lb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bap-web-local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bap_lb
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3002}
    depends_on:
      - postgres

  adminer:
    image: adminer:latest
    container_name: bap-adminer-local
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  pgdata:
